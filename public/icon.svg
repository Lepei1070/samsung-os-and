<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle with safe margin -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" stroke="#334155" stroke-width="8" />
  
  <!-- Outer Glow circle -->
  <circle cx="256" cy="256" r="170" fill="#f59e0b" fill-opacity="0.12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="12 12" />

  <!-- Navigation Compass Pin Icon -->
  <g transform="translate(136, 126)">
    <!-- Map marker pin -->
    <path d="M 120 10 C 65 10, 20 55, 20 110 C 20 175, 120 270, 120 270 C 120 270, 220 175, 220 110 C 220 55, 175 10, 120 10 Z" fill="url(#amber)" />
    <!-- Center camera aperture lens -->
    <circle cx="120" cy="110" r="45" fill="#090d16" />
    <!-- Navigation arrow inside lens -->
    <polygon points="120,80 148,135 120,122 92,135" fill="#fbbf24" />
  </g>
</svg>
